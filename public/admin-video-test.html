<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员 Seedance 2.0 视频生成测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #2196F3;
      background: #f5f5f5;
    }
    .section h2 {
      color: #2196F3;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .info-box h3 {
      color: #1976D2;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .info-box p {
      color: #424242;
      font-size: 13px;
      line-height: 1.6;
      margin: 5px 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    .btn-primary:hover {
      background: #1976D2;
    }
    .btn-secondary {
      background: #9E9E9E;
      color: white;
      margin-left: 10px;
    }
    .btn-secondary:hover {
      background: #757575;
    }
    .result-box {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-x: auto;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-pending {
      background: #FF9800;
      color: white;
    }
    .status-processing {
      background: #2196F3;
      color: white;
    }
    .status-succeed {
      background: #4CAF50;
      color: white;
    }
    .status-failed {
      background: #f44336;
      color: white;
    }
    .video-preview {
      margin-top: 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-preview video {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 管理员 Seedance 2.0 视频生成测试</h1>

    <div class="info-box">
      <h3>📝 说明</h3>
      <p>此页面用于测试管理员专用的 Seedance 2.0 视频生成 API。</p>
      <p>模型: <code>doubao-seedance-2-0-260128</code></p>
      <p>提供商: 火山引擎</p>
    </div>

    <div class="section">
      <h2>🔐 权限检查</h2>
      <div id="permission-status">
        <p>正在检查权限...</p>
      </div>
    </div>

    <div class="section">
      <h2>📝 创建视频生成任务</h2>
      <div class="form-group">
        <label for="prompt">视频描述（必填）</label>
        <textarea id="prompt" placeholder="描述你想要生成的视频内容...">一只可爱的小猫在阳光下玩耍，追逐蝴蝶，场景温馨可爱</textarea>
      </div>
      <div class="form-group">
        <label for="duration">视频时长（秒）</label>
        <input type="number" id="duration" value="8" min="4" max="12">
      </div>
      <div class="form-group">
        <label for="ratio">宽高比</label>
        <select id="ratio">
          <option value="16:9" selected>16:9 (横屏)</option>
          <option value="9:16">9:16 (竖屏)</option>
          <option value="1:1">1:1 (正方形)</option>
        </select>
      </div>
      <button class="btn-primary" onclick="createVideo()" id="createBtn">
        创建视频生成任务
      </button>
      <button class="btn-secondary" onclick="clearResult()">
        清空结果
      </button>
    </div>

    <div class="section">
      <h2>📊 任务状态</h2>
      <div id="task-status">
        <p>暂无任务</p>
      </div>
    </div>

    <div class="section">
      <h2>📹 视频预览</h2>
      <div id="video-preview">
        <p>视频生成完成后将在此显示</p>
      </div>
    </div>

    <div class="section">
      <h2>🔍 API 响应</h2>
      <div id="api-response" class="result-box">
        <p>API 响应将在此显示</p>
      </div>
    </div>
  </div>

  <script>
    let currentTaskId = null;
    let pollInterval = null;

    // 检查权限
    async function checkPermission() {
      try {
        const userStr = localStorage.getItem('user');
        if (!userStr) {
          document.getElementById('permission-status').innerHTML = `
            <p style="color: #f44336;">❌ 未登录</p>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">请使用管理员账号登录</p>
          `;
          document.getElementById('createBtn').disabled = true;
          return false;
        }

        const user = JSON.parse(userStr);
        if (!user.isAdmin) {
          document.getElementById('permission-status').innerHTML = `
            <p style="color: #f44336;">❌ 权限不足</p>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">当前用户: ${user.username}</p>
            <p style="font-size: 13px; color: #666;">需要管理员权限</p>
          `;
          document.getElementById('createBtn').disabled = true;
          return false;
        }

        document.getElementById('permission-status').innerHTML = `
          <p style="color: #4CAF50;">✅ 权限验证通过</p>
          <p style="font-size: 13px; color: #666; margin-top: 5px;">当前用户: ${user.username} (管理员)</p>
        `;
        document.getElementById('createBtn').disabled = false;
        return true;
      } catch (error) {
        console.error('权限检查失败:', error);
        return false;
      }
    }

    // 创建视频生成任务
    async function createVideo() {
      if (!await checkPermission()) {
        alert('请先使用管理员账号登录');
        return;
      }

      const prompt = document.getElementById('prompt').value.trim();
      const duration = parseInt(document.getElementById('duration').value);
      const ratio = document.getElementById('ratio').value;

      if (!prompt) {
        alert('请输入视频描述');
        return;
      }

      document.getElementById('createBtn').disabled = true;
      document.getElementById('createBtn').textContent = '创建中...';

      try {
        const response = await fetch('/api/admin/videos/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': 'admin',
          },
          body: JSON.stringify({
            content: [
              {
                type: 'text',
                text: prompt,
              },
            ],
            generate_audio: true,
            ratio: ratio,
            duration: duration,
            watermark: false,
          }),
        });

        const data = await response.json();
        document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);

        if (data.success) {
          currentTaskId = data.taskId;
          document.getElementById('task-status').innerHTML = `
            <p>任务ID: <code>${currentTaskId}</code></p>
            <p>状态: <span class="status-badge status-pending">PENDING</span></p>
            <p>消息: ${data.message}</p>
          `;

          // 开始轮询
          startPolling();
        } else {
          alert('创建任务失败: ' + data.error);
        }
      } catch (error) {
        console.error('创建任务失败:', error);
        alert('创建任务失败: ' + error.message);
      } finally {
        document.getElementById('createBtn').disabled = false;
        document.getElementById('createBtn').textContent = '创建视频生成任务';
      }
    }

    // 开始轮询任务状态
    function startPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
      }

      pollInterval = setInterval(async () => {
        try {
          const response = await fetch(`/api/admin/videos/generate?taskId=${currentTaskId}`, {
            headers: {
              'x-user-id': 'admin',
            },
          });

          const data = await response.json();
          document.getElementById('api-response').textContent = JSON.stringify(data, null, 2);

          if (data.status === 'SUCCEED') {
            clearInterval(pollInterval);
            pollInterval = null;

            document.getElementById('task-status').innerHTML = `
              <p>任务ID: <code>${currentTaskId}</code></p>
              <p>状态: <span class="status-badge status-succeed">SUCCEED</span></p>
              <p>时长: ${data.result.duration} 秒</p>
            `;

            // 显示视频预览
            document.getElementById('video-preview').innerHTML = `
              <video controls autoplay loop class="video-preview">
                <source src="${data.result.video_url}" type="video/mp4">
                您的浏览器不支持视频播放。
              </video>
            `;
          } else if (data.status === 'FAILED') {
            clearInterval(pollInterval);
            pollInterval = null;

            document.getElementById('task-status').innerHTML = `
              <p>任务ID: <code>${currentTaskId}</code></p>
              <p>状态: <span class="status-badge status-failed">FAILED</span></p>
            `;
            alert('视频生成失败');
          } else {
            const statusClass = data.status === 'PROCESSING' ? 'status-processing' : 'status-pending';
            document.getElementById('task-status').innerHTML = `
              <p>任务ID: <code>${currentTaskId}</code></p>
              <p>状态: <span class="status-badge ${statusClass}">${data.status}</span></p>
            `;
          }
        } catch (error) {
          console.error('查询任务状态失败:', error);
        }
      }, 5000); // 每 5 秒查询一次
    }

    // 清空结果
    function clearResult() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }

      currentTaskId = null;
      document.getElementById('task-status').innerHTML = '<p>暂无任务</p>';
      document.getElementById('video-preview').innerHTML = '<p>视频生成完成后将在此显示</p>';
      document.getElementById('api-response').textContent = '<p>API 响应将在此显示</p>';
    }

    // 页面加载时检查权限
    checkPermission();

    // 监听 localStorage 变化（用于登录后自动刷新）
    window.addEventListener('storage', (e) => {
      if (e.key === 'user') {
        checkPermission();
      }
    });
  </script>
</body>
</html>
