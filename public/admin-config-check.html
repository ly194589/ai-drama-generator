<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员配置检查</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .info-box {
      background: #f5f5f5;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .info-box h2 {
      color: #2196F3;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .info-box p {
      color: #666;
      margin: 5px 0;
      font-size: 14px;
    }
    .info-box .value {
      color: #333;
      font-weight: 600;
    }
    .config-section {
      margin-top: 20px;
    }
    .config-section h2 {
      color: #4CAF50;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .config-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .config-item:last-child {
      border-bottom: none;
    }
    .config-item .label {
      color: #666;
      font-size: 14px;
    }
    .config-item .value {
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge-admin {
      background: #4CAF50;
      color: white;
    }
    .badge-normal {
      background: #9E9E9E;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 管理员配置检查</h1>

    <div class="info-box">
      <h2>👤 用户信息</h2>
      <p>用户ID: <span class="value" id="userId">-</span></p>
      <p>用户名: <span class="value" id="username">-</span></p>
      <p>管理员: <span class="value" id="isAdmin">-</span></p>
    </div>

    <div class="info-box">
      <h2>📹 视频生成模型</h2>
      <p>当前模型: <span class="value" id="videoModel">-</span></p>
      <p>方案: <span class="value" id="solution">-</span></p>
    </div>

    <div class="info-box">
      <h2>📊 当前配置</h2>
      <p>LLM 模型: <span class="value" id="llmModel">-</span></p>
      <p>图片尺寸: <span class="value" id="imageSize">-</span></p>
      <p>TTS 语音: <span class="value" id="ttsSpeaker">-</span></p>
    </div>

    <div class="info-box">
      <h2>💡 说明</h2>
      <p><strong>Seedance 1.5 Pro</strong> (doubao-seedance-1-5-pro-251215) - 普通用户可用</p>
      <p><strong>Seedance 2.0</strong> (doubao-seedance-2-0-260128) - 仅管理员可用</p>
    </div>

    <div class="config-section">
      <h2>🔧 如何更改视频模型</h2>
      <div class="config-item">
        <span class="label">步骤 1</span>
        <span class="value">进入设置页面</span>
      </div>
      <div class="config-item">
        <span class="label">步骤 2</span>
        <span class="value">找到"模型配置"部分</span>
      </div>
      <div class="config-item">
        <span class="label">步骤 3</span>
        <span class="value">在"视频生成模型"下拉菜单中选择</span>
      </div>
      <div class="config-item">
        <span class="label">步骤 4</span>
        <span class="value">保存配置</span>
      </div>
    </div>
  </div>

  <script>
    // 从 localStorage 读取用户信息和配置
    const userStr = localStorage.getItem('user');
    const subscriptionStr = localStorage.getItem('subscription');

    if (userStr) {
      const user = JSON.parse(userStr);
      document.getElementById('userId').textContent = user.id || '-';
      document.getElementById('username').textContent = user.username || '-';
      document.getElementById('isAdmin').textContent = user.isAdmin ? '是' : '否';
      document.getElementById('isAdmin').innerHTML = user.isAdmin
        ? '是 <span class="badge badge-admin">管理员</span>'
        : '否 <span class="badge badge-normal">普通用户</span>';
    } else {
      document.getElementById('userId').textContent = '未登录';
    }

    // 从 localStorage 读取配置（模拟）
    // 实际配置存储在数据库中，需要通过 API 获取
    document.getElementById('llmModel').textContent = 'Doubao Seed 2.0 Pro (doubao-seed-2-0-pro-250221)';
    document.getElementById('imageSize').textContent = '2K';
    document.getElementById('ttsSpeaker').textContent = '米子（女）';
    document.getElementById('solution').textContent = '扣子方案';

    // 显示当前视频模型
    const subscription = subscriptionStr ? JSON.parse(subscriptionStr) : null;
    const isAdmin = userStr ? JSON.parse(userStr).isAdmin : false;

    if (isAdmin) {
      // 管理员可以查看当前配置
      document.getElementById('videoModel').innerHTML = 'Seedance 1.5 Pro (doubao-seedance-1-5-pro-251215)<br><span style="font-size:12px;color:#666">管理员可切换到 Seedance 2.0</span>';
    } else {
      document.getElementById('videoModel').textContent = 'Seedance 1.5 Pro (doubao-seedance-1-5-pro-251215)';
    }
  </script>
</body>
</html>
