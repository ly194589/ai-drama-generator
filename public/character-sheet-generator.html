<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人物立绘生成</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .section {
      margin-bottom: 30px;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #2196F3;
      background: #f5f5f5;
    }
    .section h2 {
      color: #2196F3;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .info-box h3 {
      color: #1976D2;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .info-box p {
      color: #424242;
      font-size: 13px;
      line-height: 1.6;
      margin: 5px 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #2196F3;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:disabled {
      background: #9E9E9E;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      margin-left: 10px;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .result-container {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      border: 2px dashed #ddd;
    }
    .result-image {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-box {
      background: #ffebee;
      border-left: 4px solid #f44336;
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
    }
    .success-box {
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
    }
    .prompt-preview {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 15px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .download-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .download-btn:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 人物立绘生成器</h1>

    <div class="info-box">
      <h3>📝 功能说明</h3>
      <p>生成包含正面照、侧面照、背面照的完整人物立绘图。</p>
      <p>• <strong>布局</strong>：三栏式（左：正面，中：侧面，右：背面）</p>
      <p>• <strong>比例</strong>：16:9 宽高比</p>
      <p>• <strong>格式</strong>：PNG 格式，背景透明</p>
      <p>• <strong>质量</strong>：标准 2K (2560×1440) 或 高清 4K (4096×2304)</p>
    </div>

    <div class="section">
      <h2>✏️ 角色信息</h2>
      <div class="form-group">
        <label for="characterName">角色名称 <span style="color: #f44336;">*</span></label>
        <input type="text" id="characterName" placeholder="例如：艾琳公主" value="">
      </div>

      <div class="form-group">
        <label for="description">角色描述 <span style="color: #f44336;">*</span></label>
        <textarea id="description" placeholder="描述角色的外貌特征、发型、眼睛颜色、气质、性格等&#10;例如：金色长发，碧绿色眼睛，优雅的公主气质，温柔善良，面带微笑"></textarea>
      </div>

      <div class="form-group">
        <label for="outfit">服装造型 <span style="color: #f44336;">*</span></label>
        <textarea id="outfit" placeholder="描述角色的服装、饰品、配饰等&#10;例如：白色宫廷长裙，淡蓝色披风，头戴皇冠，佩戴珍珠项链"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="style">插画风格</label>
          <select id="style">
            <option value="二次元插画风格" selected>二次元插画风格</option>
            <option value="日式动漫风格">日式动漫风格</option>
            <option value="古风插画风格">古风插画风格</option>
            <option value="写实插画风格">写实插画风格</option>
            <option value="赛博朋克风格">赛博朋克风格</option>
            <option value="欧美插画风格">欧美插画风格</option>
          </select>
        </div>
        <div class="form-group">
          <label for="quality">质量等级</label>
          <select id="quality">
            <option value="standard" selected>标准 2K (2560×1440)</option>
            <option value="high">高清 4K (4096×2304)</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" onclick="generateCharacter()" id="generateBtn">
        生成人物立绘
      </button>
      <button class="btn-secondary" onclick="clearResult()">
        清空结果
      </button>
    </div>

    <div class="section">
      <h2>🎬 生成结果</h2>
      <div id="result" class="result-container">
        <p style="color: #999; text-align: center;">填写角色信息后点击"生成人物立绘"</p>
      </div>
    </div>

    <div class="section" id="promptSection" style="display: none;">
      <h2>📋 生成的提示词</h2>
      <div id="promptPreview" class="prompt-preview"></div>
    </div>
  </div>

  <script>
    async function generateCharacter() {
      const characterName = document.getElementById('characterName').value.trim();
      const description = document.getElementById('description').value.trim();
      const outfit = document.getElementById('outfit').value.trim();
      const style = document.getElementById('style').value;
      const quality = document.getElementById('quality').value;

      // 验证必填参数
      if (!characterName) {
        alert('请输入角色名称');
        return;
      }
      if (!description) {
        alert('请输入角色描述');
        return;
      }
      if (!outfit) {
        alert('请输入服装造型');
        return;
      }

      const resultDiv = document.getElementById('result');
      const generateBtn = document.getElementById('generateBtn');

      // 显示加载状态
      resultDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>正在生成人物立绘，请稍候...</p>
          <p style="font-size: 13px; margin-top: 10px; color: #999;">
            预计需要 10-30 秒，请耐心等待
          </p>
        </div>
      `;
      generateBtn.disabled = true;
      generateBtn.textContent = '生成中...';

      try {
        const response = await fetch('/api/images/character-sheet', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            characterName,
            description,
            outfit,
            style,
            quality,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '生成失败');
        }

        if (!data.success || !data.characterSheet?.data) {
          throw new Error('未收到生成的图片数据');
        }

        // 显示生成的图片
        const imageUrl = data.characterSheet.url;
        const size = data.characterSheet.size;

        resultDiv.innerHTML = `
          <img src="${imageUrl}" alt="人物立绘" class="result-image" />
          <div style="margin-top: 20px; text-align: center;">
            <button class="download-btn" onclick="downloadImage('${imageUrl}', '${characterName}')">
              💾 下载立绘 (PNG)
            </button>
            <p style="margin-top: 10px; font-size: 13px; color: #666;">
              尺寸: ${size} | 格式: PNG (透明背景)
            </p>
          </div>
        `;

        // 显示提示词
        document.getElementById('promptPreview').textContent = data.characterSheet.prompt;
        document.getElementById('promptSection').style.display = 'block';

        console.log('人物立绘生成成功:', {
          characterName,
          size,
        });

      } catch (error) {
        console.error('生成失败:', error);
        resultDiv.innerHTML = `
          <div class="error-box">
            <h3 style="color: #f44336; margin-bottom: 10px;">生成失败</h3>
            <p>${error.message}</p>
            <p style="margin-top: 10px; font-size: 13px; color: #666;">
              请检查输入信息后重试
            </p>
          </div>
        `;
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '生成人物立绘';
      }
    }

    async function downloadImage(imageUrl, characterName) {
      try {
        // 下载图片数据
        const response = await fetch(imageUrl);
        const blob = await response.blob();

        // 创建下载链接
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${characterName}_立绘_${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // 释放 URL 对象
        URL.revokeObjectURL(link.href);
      } catch (error) {
        console.error('下载失败:', error);
        alert('下载失败，请尝试直接右键保存图片');
      }
    }

    function clearResult() {
      document.getElementById('result').innerHTML = `
        <p style="color: #999; text-align: center;">填写角色信息后点击"生成人物立绘"</p>
      `;
      document.getElementById('promptSection').style.display = 'none';
      document.getElementById('characterName').value = '';
      document.getElementById('description').value = '';
      document.getElementById('outfit').value = '';
    }

    // 页面加载时的初始化
    document.addEventListener('DOMContentLoaded', () => {
      console.log('人物立绘生成器已加载');
    });
  </script>
</body>
</html>
